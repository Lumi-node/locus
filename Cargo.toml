[workspace]
resolver = "2"
members = [
    "programs/locus",
    "locus-client",
    "locus-relayer",
    "locus-demo",
    "arms-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Andrew Young <andrew@automate-capture.com>"]
license = "MIT"
repository = "https://github.com/Lumi-node/locus"

[workspace.dependencies]
# Solana / Anchor
anchor-lang = "0.31.1"
anchor-client = "0.31.1"
anchor-spl = "0.31.1"
solana-sdk = "2.0"
solana-client = "2.0"
solana-program = "2.0"

# ARMS - path dep to local clone of the public repo
arms-core = { path = "../research_repos/arms" }

# Async / HTTP
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# CLI / config
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1.5", features = ["derive"] }
bincode = "1.3"

# Hashing / merkle
sha2 = "0.10"
rs_merkle = "1.4"
hex = "0.4"

# Logging / errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
